<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>客户档案库</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e4e7ec;
    --text: #101828;
    --muted: #667085;
    --accent: #76b900;          /* NVIDIA green */
    --accent-dark: #5a9100;
    --accent-soft: #eaf5d6;
    --danger: #d92d20;
    --warn: #f79009;
    --info: #1570ef;
    --shadow: 0 1px 3px rgba(16,24,40,.08), 0 1px 2px rgba(16,24,40,.04);
    --shadow-lg: 0 12px 32px rgba(16,24,40,.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }
  /* ===== Layout ===== */
  .app {
    display: grid;
    grid-template-columns: 260px 1fr;
    min-height: 100vh;
  }
  .sidebar {
    background: #0f1419;
    color: #e4e7ec;
    padding: 24px 18px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  .sidebar h1 {
    font-size: 18px;
    margin: 0 0 4px;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sidebar h1 .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
  }
  .sidebar .sub { font-size: 12px; color: #98a2b3; margin-bottom: 28px; }
  .nav-section { margin-bottom: 22px; }
  .nav-section h3 {
    font-size: 11px;
    color: #98a2b3;
    letter-spacing: .08em;
    text-transform: uppercase;
    margin: 0 0 10px;
    font-weight: 600;
  }
  .nav-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    color: #d0d5dd;
    font-size: 13px;
    margin-bottom: 2px;
    transition: background .15s;
  }
  .nav-item:hover { background: rgba(255,255,255,.06); }
  .nav-item.active { background: rgba(118,185,0,.15); color: #fff; }
  .nav-item .count {
    background: rgba(255,255,255,.1);
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    color: #98a2b3;
  }
  .nav-item.active .count { background: var(--accent); color: #0f1419; }

  .stats-mini {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    margin-bottom: 22px;
  }
  .stat-mini {
    background: rgba(255,255,255,.04);
    padding: 10px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,.06);
  }
  .stat-mini .v { font-size: 18px; font-weight: 600; color: #fff; }
  .stat-mini .l { font-size: 11px; color: #98a2b3; margin-top: 2px; }

  .sidebar-actions { margin-top: auto; padding-top: 16px; }

  /* ===== Main ===== */
  .main { padding: 24px 32px; }
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 22px; gap: 16px; flex-wrap: wrap;
  }
  .search {
    flex: 1; min-width: 280px;
    display: flex; align-items: center; gap: 8px;
    background: #fff; border: 1px solid var(--border);
    padding: 9px 14px; border-radius: 8px;
    box-shadow: var(--shadow);
  }
  .search input {
    flex: 1; border: 0; outline: 0; font-size: 14px;
    background: transparent; color: var(--text);
  }
  .search .icon { color: var(--muted); }

  .topbar-actions { display: flex; gap: 8px; }
  .btn {
    border: 1px solid var(--border);
    background: #fff; color: var(--text);
    padding: 8px 14px; border-radius: 6px;
    cursor: pointer; font-size: 13px;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all .15s;
  }
  .btn:hover { background: #f9fafb; border-color: #d0d5dd; }
  .btn.primary {
    background: var(--accent); border-color: var(--accent);
    color: #fff; font-weight: 500;
  }
  .btn.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  .btn.danger { color: var(--danger); border-color: #fda29b; }
  .btn.danger:hover { background: #fef3f2; }
  .btn.ghost-dark { background: transparent; color: #d0d5dd; border-color: rgba(255,255,255,.15); width: 100%; }
  .btn.ghost-dark:hover { background: rgba(255,255,255,.06); }

  /* ===== Card grid ===== */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform .15s, box-shadow .15s, border-color .15s;
    position: relative;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-lg);
    border-color: var(--accent);
  }
  .card-head {
    display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
  }
  .avatar {
    width: 44px; height: 44px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 16px;
    flex-shrink: 0;
    overflow: hidden;
    background-size: cover;
    background-position: center;
  }
  .avatar.has-img { background-image: var(--avatar-url); }
  .avatar.has-img span { display: none; }
  .avatar-large {
    width: 64px; height: 64px; border-radius: 12px; font-size: 22px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; overflow: hidden;
    background-size: cover; background-position: center;
    flex-shrink: 0;
  }
  .avatar-large.has-img span { display: none; }
  .avatar-upload {
    position: relative; cursor: pointer;
    width: 84px; height: 84px; border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: #fff; font-size: 24px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    background-size: cover; background-position: center;
    border: 2px dashed transparent;
    transition: border-color .2s;
  }
  .avatar-upload:hover { border-color: var(--accent); }
  .avatar-upload .overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,.45);
    color: #fff; font-size: 11px;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .2s;
  }
  .avatar-upload:hover .overlay { opacity: 1; }
  .avatar-upload input[type=file] { display: none; }
  .avatar-actions { display: flex; flex-direction: column; gap: 6px; justify-content: center; }
  .avatar-actions .small {
    font-size: 11px; padding: 4px 8px; border-radius: 4px;
    border: 1px solid var(--border); background: #fff;
    cursor: pointer; color: var(--muted);
  }
  .avatar-actions .small:hover { color: var(--text); }
  .card-title { font-size: 15px; font-weight: 600; margin: 0; }
  .card-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .badge {
    position: absolute; top: 14px; right: 14px;
    font-size: 11px; padding: 3px 8px; border-radius: 12px;
    font-weight: 600;
  }
  .badge.A { background: #ecfdf3; color: #027a48; }
  .badge.B { background: #eff8ff; color: #175cd3; }
  .badge.C { background: #fffaeb; color: #b54708; }

  .score-pill {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--accent-soft); color: var(--accent-dark);
    padding: 3px 8px; border-radius: 10px;
    font-size: 11px; font-weight: 600;
  }
  .score-pill .num { font-size: 13px; }
  .score-pill.hot { background: #fef0c7; color: #b54708; }

  .yn-pill {
    display: inline-block; padding: 2px 7px; border-radius: 3px;
    font-size: 11px; font-weight: 500;
  }
  .yn-pill.yes { background: #ecfdf3; color: #027a48; }
  .yn-pill.no  { background: #f2f4f7; color: #667085; }

  .score-summary {
    display: flex; flex-wrap: wrap; gap: 8px;
    background: linear-gradient(135deg, #fafbfc, #f0f9ff);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; margin-bottom: 16px;
  }
  .score-summary .item {
    display: flex; align-items: center; gap: 6px;
    background: #fff; padding: 5px 10px; border-radius: 6px;
    border: 1px solid var(--border); font-size: 12px;
  }
  .score-summary .item .k { color: var(--muted); }
  .score-total {
    margin-left: auto;
    display: flex; align-items: center; gap: 8px;
    background: var(--accent); color: #fff;
    padding: 6px 14px; border-radius: 8px;
    font-weight: 700; font-size: 14px;
  }
  .score-total .max { opacity: .7; font-weight: 500; font-size: 11px; }

  .card-meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
  .tag {
    font-size: 11px; padding: 3px 8px; border-radius: 4px;
    background: var(--accent-soft); color: var(--accent-dark);
    font-weight: 500;
  }
  .tag.gray { background: #f2f4f7; color: #344054; }
  .card-row {
    display: flex; justify-content: space-between;
    font-size: 12px; color: var(--muted); padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .card-row strong { color: var(--text); font-weight: 600; }

  /* ===== Empty state ===== */
  .empty {
    text-align: center; padding: 80px 20px;
    color: var(--muted);
  }
  .empty .icon { font-size: 48px; margin-bottom: 12px; opacity: .3; }

  /* ===== Detail drawer ===== */
  .drawer-mask {
    position: fixed; inset: 0; background: rgba(16,24,40,.4);
    opacity: 0; visibility: hidden; transition: all .2s;
    z-index: 100;
  }
  .drawer-mask.open { opacity: 1; visibility: visible; }
  .drawer {
    position: fixed; top: 0; right: 0;
    width: min(720px, 100%);
    height: 100vh; background: #fff;
    box-shadow: -8px 0 40px rgba(16,24,40,.16);
    transform: translateX(100%);
    transition: transform .25s ease;
    z-index: 101;
    overflow-y: auto;
    display: flex; flex-direction: column;
  }
  .drawer.open { transform: translateX(0); }
  .drawer-head {
    padding: 22px 28px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    background: #fff;
    position: sticky; top: 0; z-index: 5;
  }
  .drawer-head h2 { margin: 0; font-size: 18px; }
  .drawer-body { padding: 24px 28px; flex: 1; }
  .drawer-foot {
    padding: 16px 28px;
    border-top: 1px solid var(--border);
    display: flex; gap: 8px; justify-content: flex-end;
    background: #fff;
    position: sticky; bottom: 0;
  }
  .close-btn {
    background: transparent; border: 0; cursor: pointer;
    width: 32px; height: 32px; border-radius: 6px;
    color: var(--muted); font-size: 20px;
    display: flex; align-items: center; justify-content: center;
  }
  .close-btn:hover { background: #f2f4f7; color: var(--text); }

  /* ===== Detail content ===== */
  .section { margin-bottom: 28px; }
  .section h3 {
    font-size: 13px;
    margin: 0 0 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .05em;
    font-weight: 600;
    display: flex; align-items: center; gap: 6px;
  }
  .section h3::before {
    content: ''; width: 3px; height: 14px;
    background: var(--accent); border-radius: 2px;
  }
  .info-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px;
  }
  .info-item .label { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .info-item .value { font-size: 14px; color: var(--text); font-weight: 500; }

  .contact-list, .record-list { display: flex; flex-direction: column; gap: 10px; }
  .contact-card, .record-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    background: #fafbfc;
  }
  .contact-card .head, .record-card .head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 6px;
  }
  .contact-card .name { font-weight: 600; }
  .role-tag {
    font-size: 11px; padding: 2px 8px; border-radius: 4px;
    background: #fff; border: 1px solid var(--border);
    color: var(--muted);
  }
  .role-tag.决策者 { background: #fef3f2; color: var(--danger); border-color: #fecdca; }
  .role-tag.影响者 { background: #fffaeb; color: var(--warn); border-color: #fec84b; }
  .role-tag.把关者 { background: #eff8ff; color: var(--info); border-color: #b2ddff; }
  .role-tag.使用者 { background: #ecfdf3; color: #027a48; border-color: #abefc6; }
  .contact-card .detail, .record-card .detail {
    font-size: 12px; color: var(--muted);
  }

  .stage-tag {
    font-size: 11px; padding: 2px 8px; border-radius: 10px;
    font-weight: 500;
  }
  .stage-tag.线索 { background: #f2f4f7; color: #344054; }
  .stage-tag.商机 { background: #eff8ff; color: var(--info); }
  .stage-tag.进行中 { background: #fffaeb; color: var(--warn); }
  .stage-tag.已成交 { background: #ecfdf3; color: #027a48; }
  .stage-tag.已流失 { background: #fef3f2; color: var(--danger); }

  .timeline-item { position: relative; padding-left: 16px; border-left: 2px solid var(--border); }

  /* ===== Form (edit drawer) ===== */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
  .form-grid .full { grid-column: 1 / -1; }
  .field { display: flex; flex-direction: column; }
  .field label {
    font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 500;
  }
  .field input, .field select, .field textarea {
    border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; font-size: 13px; font-family: inherit;
    background: #fff; color: var(--text); outline: 0;
    transition: border-color .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(118,185,0,.15);
  }
  .field textarea { resize: vertical; min-height: 60px; }

  .sub-form {
    border: 1px dashed #d0d5dd; border-radius: 8px;
    padding: 12px; margin-bottom: 10px; background: #fafbfc;
  }
  .sub-form .form-grid { grid-template-columns: 1fr 1fr 1fr; }
  .sub-form-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
  }
  .sub-form-head strong { font-size: 13px; }
  .icon-btn {
    border: 0; background: transparent; cursor: pointer;
    color: var(--danger); font-size: 12px;
  }
  .add-sub {
    border: 1px dashed #d0d5dd; background: transparent;
    width: 100%; padding: 10px; border-radius: 8px;
    color: var(--muted); cursor: pointer; font-size: 13px;
  }
  .add-sub:hover { border-color: var(--accent); color: var(--accent-dark); }

  /* ===== Toast ===== */
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%);
    background: #0f1419; color: #fff;
    padding: 10px 18px; border-radius: 8px;
    font-size: 13px; z-index: 200;
    opacity: 0; transition: opacity .2s, transform .2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

  /* ===== Responsive ===== */
  @media (max-width: 768px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: relative; height: auto; }
    .main { padding: 16px; }
    .form-grid, .info-grid, .sub-form .form-grid { grid-template-columns: 1fr; }
  }

  /* Hidden file input */
  #importFile { display: none; }
</style>
</head>
<body>

<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <a href="index.html" style="color:#98a2b3;font-size:12px;text-decoration:none;display:inline-block;margin-bottom:14px;">← 返回 Frank Consulting</a>
    <h1><span class="dot"></span>客户档案库</h1>
    <div class="sub">Customer Archive</div>

    <div class="stats-mini">
      <div class="stat-mini">
        <div class="v" id="statTotal">0</div>
        <div class="l">客户总数</div>
      </div>
      <div class="stat-mini">
        <div class="v" id="statA">0</div>
        <div class="l">A 级客户</div>
      </div>
      <div class="stat-mini">
        <div class="v" id="statDeal">0</div>
        <div class="l">已成交</div>
      </div>
      <div class="stat-mini">
        <div class="v" id="statActive">0</div>
        <div class="l">进行中</div>
      </div>
    </div>

    <div class="nav-section">
      <h3>客户等级</h3>
      <div id="navLevels"></div>
    </div>
    <div class="nav-section">
      <h3>行业</h3>
      <div id="navIndustries"></div>
    </div>
    <div class="nav-section">
      <h3>风险</h3>
      <div id="navRisks"></div>
    </div>

    <div class="nav-section">
      <h3>💾 自动备份</h3>
      <label style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;background:rgba(255,255,255,.04);cursor:pointer;font-size:12px;color:#d0d5dd;">
        <input type="checkbox" id="autoBackupToggle" onchange="onToggleAutoBackup(this.checked)" style="accent-color:var(--accent);" />
        <span>保存时自动备份 JSON</span>
      </label>
      <div id="backupStatus" style="font-size:11px;color:#98a2b3;margin-top:6px;padding:0 4px;line-height:1.5;"></div>
    </div>

    <div class="sidebar-actions">
      <button class="btn ghost-dark" onclick="exportData()">↓ 立即导出 JSON</button>
      <div style="height:8px"></div>
      <button class="btn ghost-dark" onclick="document.getElementById('importFile').click()">↑ 导入 JSON</button>
      <input type="file" id="importFile" accept=".json" onchange="importData(event)" />
      <div style="height:8px"></div>
      <button class="btn ghost-dark" onclick="exportCSV()">↓ 导出 CSV</button>
      <div style="height:8px"></div>
      <button class="btn ghost-dark" onclick="resetDemo()">↻ 重置示例数据</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="topbar">
      <div class="search">
        <span class="icon">🔍</span>
        <input id="searchInput" type="text" placeholder="搜索客户名称、行业、标签、联系人…" oninput="render()" />
      </div>
      <div class="topbar-actions">
        <button class="btn primary" onclick="openEditDrawer()">+ 新建客户</button>
      </div>
    </div>

    <div id="cardGrid" class="grid"></div>
    <div id="emptyState" class="empty" style="display:none">
      <div class="icon">📋</div>
      <div>没有找到匹配的客户</div>
      <div style="margin-top:6px; font-size:12px">尝试清空筛选条件,或新建一个客户</div>
    </div>
  </main>
</div>

<!-- Detail drawer -->
<div class="drawer-mask" id="detailMask" onclick="closeDetail()"></div>
<div class="drawer" id="detailDrawer">
  <div class="drawer-head">
    <h2 id="detailTitle">客户详情</h2>
    <button class="close-btn" onclick="closeDetail()">×</button>
  </div>
  <div class="drawer-body" id="detailBody"></div>
  <div class="drawer-foot">
    <button class="btn danger" onclick="deleteCurrent()">删除</button>
    <button class="btn" onclick="closeDetail()">关闭</button>
    <button class="btn primary" onclick="editCurrent()">编辑</button>
  </div>
</div>

<!-- Edit drawer -->
<div class="drawer-mask" id="editMask" onclick="closeEdit()"></div>
<div class="drawer" id="editDrawer">
  <div class="drawer-head">
    <h2 id="editTitle">新建客户</h2>
    <button class="close-btn" onclick="closeEdit()">×</button>
  </div>
  <div class="drawer-body" id="editBody"></div>
  <div class="drawer-foot">
    <button class="btn" onclick="closeEdit()">取消</button>
    <button class="btn primary" onclick="saveEdit()">保存</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============== Demo data ==============
const DEMO = [
  {
    id: "c001",
    name: "未来动力科技有限公司",
    short: "未来动力",
    industry: "新能源汽车",
    scale: "大型",
    region: "上海",
    website: "www.futuredrive.example",
    address: "上海市浦东新区张江高科技园区科苑路 88 号",
    established: "2015",
    revenue: "50 亿元 / 年",
    level: "A",
    risk: "低",
    tags: ["战略客户", "AI 计算", "自动驾驶", "续约高意愿"],
    needs: "需要大规模 GPU 集群用于自动驾驶模型训练,关注稳定性与售后响应",
    owner: "Frank Wang",

// ============== State ==============
const STORE_KEY = "cowork_customer_archive_v1";
const FILTER_KEY = "cowork_customer_archive_filter_v1";
let customers = load();
let activeFilter = JSON.parse(localStorage.getItem(FILTER_KEY) || '{"type":"all","value":""}');
let currentId = null;
let editingId = null;
let editDraft = null;

function load() {
  try {
    const saved = localStorage.getItem(STORE_KEY);
    if (saved) return JSON.parse(saved);
  } catch(e) {}
  return JSON.parse(JSON.stringify(DEMO));
}
function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(customers));
    localStorage.setItem(FILTER_KEY, JSON.stringify(activeFilter));
  } catch (e) {
    // QuotaExceededError 通常是头像太多/太大,或私密模式
    alert(
      "⚠️ 保存到浏览器失败:" + (e.message || e) +
      "\n\n可能原因:头像图片太多导致超出 localStorage 配额 (~5MB),或当前是隐身模式。" +
      "\n建议立即点击 \"↓ 立即导出 JSON\" 备份,然后清理一些大头像。"
    );
    return;
  }
  scheduleAutoBackup();
}

// ============== Auto-backup ==============
const AUTOBACKUP_KEY = "cowork_customer_archive_autobackup_v1";
const LAST_BACKUP_KEY = "cowork_customer_archive_lastbackup_v1";
let autoBackupOn = localStorage.getItem(AUTOBACKUP_KEY) === "1";
let autoBackupTimer = null;
const AUTOBACKUP_DEBOUNCE_MS = 5000;

function onToggleAutoBackup(checked) {
  autoBackupOn = checked;
  localStorage.setItem(AUTOBACKUP_KEY, checked ? "1" : "0");
  updateBackupStatus();
  if (checked) {
    // 打开开关后立刻备份一次,作为基准
    runAutoBackup(true);
  }
}

function scheduleAutoBackup() {
  if (!autoBackupOn) { updateBackupStatus(); return; }
  if (autoBackupTimer) clearTimeout(autoBackupTimer);
  updateBackupStatus("即将备份…");
  autoBackupTimer = setTimeout(() => runAutoBackup(false), AUTOBACKUP_DEBOUNCE_MS);
}

function runAutoBackup(immediate) {
  try {
    const json = JSON.stringify(customers, null, 2);
    const blob = new Blob([json], { type: "application/json" });
    // 固定文件名,浏览器会自动追加 (1)(2),用户也可以保持默认覆盖
    download(blob, "customer-archive-backup.json");
    const now = new Date();
    localStorage.setItem(LAST_BACKUP_KEY, now.toISOString());
    updateBackupStatus();
    if (!immediate) toast("已自动备份到下载文件夹");
  } catch (e) {
    updateBackupStatus("备份失败: " + (e.message || e));
  }
}

function backupNow() {
  if (autoBackupTimer) { clearTimeout(autoBackupTimer); autoBackupTimer = null; }
  runAutoBackup(true);
}

function updateBackupStatus(extra) {
  const el = document.getElementById("backupStatus");
  if (!el) return;
  const last = localStorage.getItem(LAST_BACKUP_KEY);
  const cb = document.getElementById("autoBackupToggle");
  if (cb) cb.checked = autoBackupOn;
  if (extra) {
    el.textContent = "⏳ " + extra;
    return;
  }
  if (!autoBackupOn) {
    el.innerHTML = '<span style="color:#98a2b3">未启用 · 改动只存浏览器</span>';
    return;
  }
  if (last) {
    el.innerHTML = '✅ 上次备份: ' + esc(formatRelative(new Date(last))) +
      '<br><span style="opacity:.7">下载文件: customer-archive-backup.json</span>';
  } else {
    el.innerHTML = '✅ 已启用 · 下次保存时会备份';
  }
}

function formatRelative(d) {
  const diff = Math.round((Date.now() - d.getTime()) / 1000);
  if (diff < 5) return "刚刚";
  if (diff < 60) return diff + " 秒前";
  if (diff < 3600) return Math.round(diff/60) + " 分钟前";
  if (diff < 86400) return Math.round(diff/3600) + " 小时前";
  return d.toLocaleString("zh-CN");
}
function uid() { return "c" + Date.now().toString(36) + Math.random().toString(36).slice(2,5); }
function todayStr() { return new Date().toISOString().slice(0,10); }

// ============== Render ==============
function render() {
  // stats
  document.getElementById("statTotal").textContent = customers.length;
  document.getElementById("statA").textContent = customers.filter(c => c.level === "A").length;
  document.getElementById("statDeal").textContent = customers.filter(c => (c.records || []).some(r => r.stage === "已成交")).length;
  document.getElementById("statActive").textContent = customers.filter(c => (c.records || []).some(r => r.stage === "进行中" || r.stage === "商机")).length;

  // sidebar nav
  renderNav();

  // grid
  const q = (document.getElementById("searchInput").value || "").trim().toLowerCase();
  const filtered = customers.filter(c => {
    // text search
    if (q) {
      const hay = [
        c.name, c.short, c.industry, c.region, c.needs,
        (c.tags||[]).join(" "),
        (c.contacts||[]).map(x => x.name + " " + x.title).join(" ")
      ].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    // active filter
    if (activeFilter.type === "level" && c.level !== activeFilter.value) return false;
    if (activeFilter.type === "industry" && c.industry !== activeFilter.value) return false;
    if (activeFilter.type === "risk" && c.risk !== activeFilter.value) return false;
    return true;
  });

  const grid = document.getElementById("cardGrid");
  grid.innerHTML = "";
  if (filtered.length === 0) {
    document.getElementById("emptyState").style.display = "";
    return;
  }
  document.getElementById("emptyState").style.display = "none";
  filtered.forEach(c => grid.appendChild(cardEl(c)));
}

function cardEl(c) {
  const div = document.createElement("div");
  div.className = "card";
  div.onclick = () => openDetail(c.id);
  const initial = (c.short || c.name || "?").slice(0,2);
  const tagsHtml = (c.tags || []).slice(0,4).map(t => `<span class="tag">${esc(t)}</span>`).join("");
  const lastRec = (c.records || []).slice().sort((a,b) => (b.date||"").localeCompare(a.date||""))[0];
  const lastText = lastRec ? `${lastRec.date} · ${lastRec.title}` : "暂无活动";
  const avatarHtml = c.avatar
    ? `<div class="avatar has-img" style="--avatar-url:url('${escAttr(c.avatar)}')"><span>${esc(initial)}</span></div>`
    : `<div class="avatar"><span>${esc(initial)}</span></div>`;
  const score = effectivePoints(c);
  const hasScoring = c.married || c.child || c.house || c.dissatisfied ||
    c.entrepreneurship || c.coachable || c.totalPoints;
  const scorePill = hasScoring
    ? `<span class="score-pill ${score >= 4 ? 'hot' : ''}" title="评估总分 (满分 6)">⭐ <span class="num">${score}</span>/6</span>`
    : "";
  div.innerHTML = `
    <span class="badge ${c.level||'C'}">${c.level||'C'} 级</span>
    <div class="card-head">
      ${avatarHtml}
      <div>
        <div class="card-title">${esc(c.short || c.name)}</div>
        <div class="card-sub">${esc(c.industry || "")}${c.region ? " · " + esc(c.region) : ""}</div>
      </div>
    </div>
    <div class="card-meta">
      ${scorePill}
      ${tagsHtml}
      ${(c.tags||[]).length > 4 ? `<span class="tag gray">+${c.tags.length - 4}</span>` : ""}
    </div>
    <div class="card-row">
      <span>${esc((c.contacts||[]).length)} 联系人 · ${esc((c.records||[]).length)} 条记录</span>
      <strong>${esc(lastText)}</strong>
    </div>
  `;
  return div;
}

function renderNav() {
  // levels
  const lvlCount = countBy("level");
  const navL = document.getElementById("navLevels");
  navL.innerHTML = navItem({type:"all", value:""}, "全部客户", customers.length);
  ["A","B","C"].forEach(L => {
    navL.innerHTML += navItem({type:"level", value:L}, L + " 级", lvlCount[L] || 0);
  });

  // industries
  const indCount = countBy("industry");
  const navI = document.getElementById("navIndustries");
  navI.innerHTML = "";
  Object.entries(indCount).sort((a,b)=>b[1]-a[1]).forEach(([k,v]) => {
    navI.innerHTML += navItem({type:"industry", value:k}, k, v);
  });

  // risks
  const riskCount = countBy("risk");
  const navR = document.getElementById("navRisks");
  navR.innerHTML = "";
  ["低","中","高"].forEach(R => {
    if (riskCount[R]) navR.innerHTML += navItem({type:"risk", value:R}, R + " 风险", riskCount[R]);
  });
}

function countBy(field) {
  const m = {};
  customers.forEach(c => { const v = c[field]; if (v) m[v] = (m[v]||0) + 1; });
  return m;
}

function navItem(filter, label, count) {
  const active = filter.type === activeFilter.type && filter.value === activeFilter.value;
  return `<div class="nav-item ${active?'active':''}" onclick='setFilter(${JSON.stringify(filter)})'>
    <span>${esc(label)}</span><span class="count">${count}</span>
  </div>`;
}

function setFilter(f) {
  activeFilter = f;
  save();
  render();
}

  const c = customers.find(x => x.id === id);

  document.getElementById("detailTitle").innerHTML = detailTitleHtml(c);
  document.getElementById("detailBody").innerHTML = detailHtml(c);

  document.getElementById("detailDrawer").classList.add("open");

function closeDetail() {
  currentId = null;
  document.getElementById("detailMask").classList.remove("open");
  document.getElementById("detailDrawer").classList.remove("open");

// 评估打分: 6 个 yes/no 字段中 "是" 的个数
function computeScore(c) {
  const yes = v => (v === "是" || v === "Yes" || v === "yes" || v === true);
  return ["married","child","house","dissatisfied","entrepreneurship","coachable"]
    .reduce((sum, k) => sum + (yes(c[k]) ? 1 : 0), 0);
}
function effectivePoints(c) {
  if (c.totalPoints !== "" && c.totalPoints != null) {
    const n = Number(c.totalPoints); if (!isNaN(n)) return n;
  }
  return computeScore(c);
}

function val(id){ const el = document.getElementById(id); return el ? el.value : ""; }

function onAvatarPick(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (!file.type.startsWith("image/")) { alert("请选择图片文件"); return; }
  const reader = new FileReader();
  reader.onload = ev => {
    // Downscale via canvas to keep localStorage small (max 240px, JPEG ~0.85)
    const img = new Image();
    img.onload = () => {
      const max = 240;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
      syncDraftFromForm();
      editDraft.avatar = dataUrl;
      renderEditForm();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}
function onAvatarUrl(url) {
  const trimmed = (url || "").trim();
  if (!trimmed) return;
  // Only commit on blur / debounce a bit — store directly, lazy
  editDraft.avatar = trimmed;
  // Live preview without re-render: update the avatar box
  const box = document.getElementById("avatarBox");
  if (box) {
    box.style.backgroundImage = `url('${trimmed}')`;
    const span = box.querySelector("span:not(.overlay)");
    if (span) span.style.display = "none";
  }
}
function clearAvatar() {
  syncDraftFromForm();
  editDraft.avatar = "";
  renderEditForm();
}

function addContact() {
  syncDraftFromForm();
  editDraft.contacts.push({ name:"", title:"", role:"", phone:"", email:"", notes:"" });
  renderEditForm();
}
function removeContact(i) {
  syncDraftFromForm();
  editDraft.contacts.splice(i,1);
  renderEditForm();
}
function addRecord() {
  syncDraftFromForm();
  editDraft.records.push({ date: todayStr(), type:"沟通", stage:"线索", title:"", amount:"", notes:"" });
  renderEditForm();
}
function removeRecord(i) {
  syncDraftFromForm();
  editDraft.records.splice(i,1);
  renderEditForm();
}

function saveEdit() {
  syncDraftFromForm();
  if (!editDraft.name) { alert("请填写客户全称"); return; }
  editDraft.updatedAt = todayStr();
  if (editingId) {
    const idx = customers.findIndex(c => c.id === editingId);
    if (idx >= 0) customers[idx] = editDraft;
  } else {
    customers.unshift(editDraft);
  }
  save();
  closeEdit();
  render();
  toast(editingId ? "已更新" : "已新增");
}

// ============== Import / Export ==============
function exportData() {
  const blob = new Blob([JSON.stringify(customers, null, 2)], {type:"application/json"});
  download(blob, "customer-archive-" + todayStr() + ".json");
}
function importData(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const arr = JSON.parse(ev.target.result);
      if (!Array.isArray(arr)) throw new Error("格式错误");
      if (!confirm("将合并 " + arr.length + " 条数据,是否继续? (按 ID 去重,新数据覆盖旧数据)")) return;
      const map = new Map(customers.map(c => [c.id, c]));
      arr.forEach(c => { if (!c.id) c.id = uid(); map.set(c.id, c); });
      customers = Array.from(map.values());
      save(); render(); toast("已导入 " + arr.length + " 条");
    } catch(err) {
      alert("导入失败: " + err.message);
    }
    e.target.value = "";
  };
  reader.readAsText(file);
}
function exportCSV() {
  const cols = ["id","name","short","industry","scale","region","level","risk","owner","tags","needs","contacts_count","records_count","last_record","updatedAt"];
  const rows = [cols.join(",")];
  customers.forEach(c => {
    const last = (c.records||[]).slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""))[0];
    const row = [
      c.id, c.name, c.short, c.industry, c.scale, c.region, c.level, c.risk, c.owner,
      (c.tags||[]).join("/"),
      (c.needs||"").replace(/\s+/g, " "),
      (c.contacts||[]).length, (c.records||[]).length,
      last ? (last.date + " " + last.title) : "",
      c.updatedAt
    ].map(v => `"${String(v||"").replace(/"/g,'""')}"`);
    rows.push(row.join(","));
  });
  // BOM for Excel UTF-8
  const blob = new Blob(["﻿" + rows.join("\n")], {type:"text/csv"});
  download(blob, "customer-archive-" + todayStr() + ".csv");
}
function download(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function resetDemo() {
  if (!confirm("将本地数据重置为示例数据?当前所有改动会丢失。")) return;
  customers = JSON.parse(JSON.stringify(DEMO));
  activeFilter = {type:"all", value:""};
  save(); render(); toast("已重置");
}

// ============== Utils ==============
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function escAttr(s) { return esc(s); }
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove("show"), 1800);
}

// kick off
render();
updateBackupStatus();
setInterval(updateBackupStatus, 60000); // 每分钟刷新一下相对时间
